# Local sample-data preview only. Production manifests remain under k8s/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-preview
  namespace: devops-preview
  annotations:
    description: Local sample-data preview. No AWS account is queried.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitor-preview
  template:
    metadata:
      labels:
        app: monitor-preview
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monitor
          image: droralpern/flask-aws-monitor:a56aa0c325f4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_EC2_METADATA_DISABLED
              value: 'true'
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            - name: preview-code
              mountPath: /checks
              readOnly: true
          command:
            - gunicorn
            - --chdir
            - /checks
            - --bind
            - 0.0.0.0:5001
            - --workers
            - '2'
            - demo_wsgi:app
      volumes:
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: preview-code
          configMap:
            name: monitor-preview
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-preview
  namespace: devops-preview
spec:
  type: ClusterIP
  selector:
    app: monitor-preview
  ports:
    - name: http
      port: 5001
      targetPort: http
