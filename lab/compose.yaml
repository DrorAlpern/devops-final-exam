name: devops-submission
services:
  moto:
    image: motoserver/moto:5.2.3@sha256:91fd602a21f49cf9eb82fdf474015a3c131d40104c8297ea6a2ca920708ae32c
    environment:
      MOTO_PORT: "5000"
    mem_limit: 384m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [lab]
  terraform:
    image: hashicorp/terraform:1.16.2@sha256:c3308fcbb530627c102c4c4b993e226b202429084328c3cc505cc2a69342e883
    profiles: [tools]
    working_dir: /config
    environment:
      TF_DATA_DIR: /state/data
      TF_IN_AUTOMATION: "true"
    volumes:
      - ./terraform:/config:ro
      - terraform_state:/state
    mem_limit: 768m
    networks: [lab, downloads]
  monitor:
    build: ../app
    image: droralpern/flask-aws-monitor:local-lab
    ports:
      - "127.0.0.1:15005:5001"
    environment:
      AWS_ENDPOINT_URL: http://moto:5000
      AWS_ACCESS_KEY_ID: local-lab
      AWS_SECRET_ACCESS_KEY: local-lab
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - ./verify.py:/checks/verify.py:ro
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    networks: [lab, web]
    depends_on:
      moto:
        condition: service_healthy
networks:
  lab:
    internal: true
  downloads: {}
  web: {}
volumes:
  terraform_state: {}
